name: build-release

# 推 master：只编译并上传 artifact
# 推 tag（6.3.0 / v6.3.0）：编译 + 打包 FreeDownloader.zip + 创建 Release
on:
  push:
    branches: [master]
    tags: ['[0-9]*', 'v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 依赖直链，全部取各自 latest；需要固定版本时改这里即可
  YTDLP_URL: https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe
  FFMPEG_URL: https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
  CURL_URL: https://curl.se/windows/latest.cgi?p=win64-mingw.zip
  CA_URL: https://curl.se/ca/cacert.pem
  SEVENZIP_URL: https://www.7-zip.org/a/7z2501-extra.7z
  ARIA2NEXT_REPO: AnInsomniacy/aria2-next
  QJS_URL: https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-windows-x86_64.exe
  GETPROXYINFO_URL: https://github.com/HXHGTS/GetProxyInfo/releases/latest/download/GetProxyInfo.exe
  DENO_URL: https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip
  INVIDIOUS_URL: https://github.com/iv-org/invidious-companion/releases/latest/download/invidious_companion-x86_64-pc-windows-msvc.zip

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 按 tag 写入版本号
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}' -replace '^v', ''
          "#define FD_VERSION `"$v`"" | Set-Content -Path version.h -Encoding ascii
          Get-Content version.h

      - name: 编译 Release x64
        shell: cmd
        run: msbuild FreeDownloader.vcxproj /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: 组装发布目录并拉取依赖
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'stage\FreeDownloader'
          New-Item -ItemType Directory -Force "$stage\config", "$stage\cookies", "$stage\Downloads", "$stage\temp" | Out-Null

          # 程序本体、批处理工具、配置模板
          Copy-Item 'x64\Release\FreeDownloader.exe' $stage -Force
          Copy-Item '*.bat' $stage -Force
          Copy-Item 'dht.dat', 'dht6.dat' "$stage\config" -Force
          Copy-Item 'config\bt.conf' "$stage\config" -Force

          $tmp = Join-Path $env:RUNNER_TEMP 'deps'
          New-Item -ItemType Directory -Force $tmp | Out-Null

          $sevenZip = Join-Path ${env:ProgramFiles} '7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { $sevenZip = '7z' }

          function Get-File([string]$url, [string]$out) {
            curl.exe -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o $out $url
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) { throw "下载失败: $url" }
          }

          function Expand-Pkg([string]$archive, [string]$dest) {
            & $sevenZip x -y "-o$dest" $archive | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "解压失败: $archive" }
          }

          function Copy-First([string]$root, [string]$name, [string]$dest) {
            $f = Get-ChildItem $root -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $f) { throw "包内找不到 $name" }
            Copy-Item $f.FullName $dest -Force
          }

          # 单文件依赖
          Get-File $env:YTDLP_URL "$stage\yt-dlp.exe"
          Get-File $env:QJS_URL "$stage\qjs-windows-x86_64.exe"
          # aria2-next 上游资产名带版本号，先从 latest release 解析 Windows 资产地址
          $aria2Rel = gh api "repos/$env:ARIA2NEXT_REPO/releases/latest" | ConvertFrom-Json
          $aria2Asset = $aria2Rel.assets | Where-Object { $_.name -like '*windows-x86_64.exe' } | Select-Object -First 1
          if (-not $aria2Asset) { throw "无法从 $env:ARIA2NEXT_REPO 解析 Windows 资产" }
          Get-File $aria2Asset.browser_download_url "$stage\aria2-next.exe"
          Get-File $env:GETPROXYINFO_URL "$stage\GetProxyInfo.exe"
          # curl 的 CA 包单独取 Mozilla cacert.pem
          Get-File $env:CA_URL "$stage\curl-ca-bundle.crt"

          # ffmpeg / ffprobe / ffplay
          Get-File $env:FFMPEG_URL "$tmp\ffmpeg.zip"
          Expand-Pkg "$tmp\ffmpeg.zip" "$tmp\ffmpeg"
          Copy-First "$tmp\ffmpeg" 'ffmpeg.exe' $stage
          Copy-First "$tmp\ffmpeg" 'ffprobe.exe' $stage
          Copy-First "$tmp\ffmpeg" 'ffplay.exe' $stage

          # curl + libcurl
          Get-File $env:CURL_URL "$tmp\curl.zip"
          Expand-Pkg "$tmp\curl.zip" "$tmp\curl"
          Copy-First "$tmp\curl" 'curl.exe' $stage
          Copy-First "$tmp\curl" 'libcurl-x64.dll' $stage
          Copy-First "$tmp\curl" 'libcurl-x64.def' $stage

          # 7-Zip Extra（7za.exe / 7za.dll / 7zxa.dll）
          Get-File $env:SEVENZIP_URL "$tmp\7zextra.7z"
          Expand-Pkg "$tmp\7zextra.7z" "$tmp\7zextra"
          foreach ($n in '7za.exe', '7za.dll', '7zxa.dll') {
            Copy-First "$tmp\7zextra" $n $stage
          }

          # deno / invidious companion
          Get-File $env:DENO_URL "$tmp\deno.zip"
          Expand-Pkg "$tmp\deno.zip" "$tmp\deno"
          Copy-First "$tmp\deno" 'deno.exe' $stage

          Get-File $env:INVIDIOUS_URL "$tmp\invidious.zip"
          Expand-Pkg "$tmp\invidious.zip" "$tmp\invidious"
          Copy-First "$tmp\invidious" 'invidious_companion.exe' $stage

          # aria2c 兼容壳：源码里的 aria2c 调用转发到 aria2-next.exe
          powershell -NoProfile -ExecutionPolicy Bypass -File build-aria2c-shim.ps1
          if (-not (Test-Path 'aria2c.exe')) { throw 'aria2c 壳编译失败' }
          Copy-Item 'aria2c.exe' $stage -Force

          # 完整性检查
          $required = @(
            'FreeDownloader.exe', 'yt-dlp.exe', 'ffmpeg.exe', 'ffprobe.exe', 'ffplay.exe',
            'curl.exe', 'libcurl-x64.dll', 'curl-ca-bundle.crt',
            '7za.exe', '7za.dll', '7zxa.dll',
            'aria2c.exe', 'aria2-next.exe', 'qjs-windows-x86_64.exe',
            'GetProxyInfo.exe', 'deno.exe', 'invidious_companion.exe'
          )
          foreach ($n in $required) {
            $p = Join-Path $stage $n
            if (-not (Test-Path $p)) { throw "缺少文件: $n" }
            if ((Get-Item $p).Length -le 0) { throw "空文件: $n" }
          }
          Get-ChildItem $stage | Select-Object Name, Length | Sort-Object Name | Format-Table -AutoSize

      - name: 记录依赖版本
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'stage\FreeDownloader'
          "yt-dlp: " + (& "$stage\yt-dlp.exe" --version)
          "ffmpeg: " + (& "$stage\ffmpeg.exe" -version | Select-Object -First 1)
          "curl:   " + (& "$stage\curl.exe" --version | Select-Object -First 1)
          "aria2:  " + (& "$stage\aria2-next.exe" --version | Select-Object -First 1)

      - name: 打包 zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sevenZip = Join-Path ${env:ProgramFiles} '7-Zip\7z.exe'
          if (-not (Test-Path $sevenZip)) { $sevenZip = '7z' }
          Push-Location stage
          & $sevenZip a -tzip -mx=5 -mcu=on -bso0 -bsp0 ..\FreeDownloader.zip FreeDownloader
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "打包失败: $code" }
          Get-Item FreeDownloader.zip | Select-Object Name, Length

      - name: 上传构建产物
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: FreeDownloader
          path: FreeDownloader.zip
          retention-days: 14

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: FreeDownloader
          files: FreeDownloader.zip
          draft: false
          prerelease: false
